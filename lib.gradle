plugins {
    id 'java'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    // Source: https://mvnrepository.com/artifact/com.google.guava/guava
    implementation 'com.google.guava:guava:33.7.2-jre'
    // AssertJ
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
    testImplementation platform('org.junit:junit-bom:6.1.3') 
	testImplementation 'org.junit.jupiter:junit-jupiter' 
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.practicalunittesting.chp03.money'
            artifactId = 'money-library'
            version = '1.0'

            from components.java
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir('../../mvn-repo')
        }
    }
}



